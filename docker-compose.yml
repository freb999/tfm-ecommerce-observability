networks:
  tfm_network:
    name: tfm_network
    driver: bridge

volumes:
  kafka_data:
    driver: local
  flink_data:
    driver: local

services:
  # -------------------------------------------------------------------------
  # APACHE KAFKA: Motor de mensajería (Confluent Image, KRaft)
  # -------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: tfm-kafka
    networks:
      - tfm_network
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "TfmEcommerceCluster123"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -------------------------------------------------------------------------
  # APACHE FLINK: JobManager (Orquestador)
  # -------------------------------------------------------------------------
  flink-jobmanager:
    image: flink:1.18.1-scala_2.12
    container_name: tfm-flink-jobmanager
    networks:
      - tfm_network
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
    volumes:
      - flink_data:/opt/flink/data
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # APACHE FLINK: TaskManager (Trabajador)
  # -------------------------------------------------------------------------
  flink-taskmanager:
    image: flink:1.18.1-scala_2.12
    container_name: tfm-flink-taskmanager
    networks:
      - tfm_network
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    restart: unless-stopped
    depends_on:
      flink-jobmanager:
        condition: service_started